<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وزیرِ ملتانی - رائیڈر اور کسٹمر لائی
.fname{font-family:'Noto Nastaliq Urdu',serif;font-size:28px;font-weight:700;line-height:2;color:#F3D88B}

.fab{position:fixed;inset-block-end:16px;inset-inline-start:16px;z-index:30;display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:0 20px;border-radius:999px;background:var(--wa);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
<div class="grp"><span style="display:inline-flex;align-items:center;gap:6px"><i class="fa-solid fa-location-dot" style="color:var(--gold)"></i>ملتان (منڈی زون)</span>
<a class="tel" href="tel:+923056243881"><i class="fa-solid fa-phone" style="margin-inline-end:6px"></i>0305 6243881</a></div>
<div class="grp"><a href="#order">آرڈر دیں</a><span class="sep">|</span><a href="#rider-section">رائیڈر پورٹل</a></div>
</div></div>

<header class="hdr"><div class="wrap">
<a class="logo" href="#top"><i class="fa-solid fa-store" style="color:var(--gold);margin-inline-end:8px"></i>وزیرِ ملتانی</a>
<nav aria-label="مینو">
<a href="#top">ہوم</a>
<a href="#order">آرڈر بکنگ</a>
<a href="#rider-section">رائیڈر لائیو ڈیش بورڈ</a>
</nav>
</div></header>

<section class="hero"><div class="wrap">
<div class="hero-main">
<h1>ملتان کے بازار، آپ کی دہلیز پر</h1>
<p class="lead">وزیرِ ملتانی آپ کا ذاتی پلیٹ فارم۔ سبزی منڈی، غلہ منڈی یا فیکٹری سے خریداری کریں — آزاد رائیڈرز کے ذریعے فوری اور محفوظ ہوم ڈلیوری!</p>
<div class="btns">
<a class="btn" href="#order">ابھی آرڈر کریں</a>
<a class="btn ghost" href="#rider-section">رائیڈر لاگ ان کریں</a>
</div>
</div>
<div class="pills">
<div class="pill"><div><b>اصل قیمت</b><span>دکان کی اصل رسید کے مطابق</span></div></div>
<div class="pill"><div><b>آزاد رائیڈر ماڈل</b><span>قریبی رائیڈر فوری قبول کرے</span></div></div>
</div>
</div></section>

<section class="sec" id="order"><div class="wrap">
<div class="sec-head">
<h2>کسٹمر آرڈر اور آزاد رائیڈر لائیو سسٹم</h2>
<p>یہاں گاہک اپنا آرڈر بک کر سکتا ہے، اور نیچے رائیڈر اپنے ڈیش بورڈ پر لائیو آرڈر دیکھ کر قبول کر سکتا ہے۔</p>
</div>

<div class="two">
    <div class="box">
        <h3><i class="fa-solid fa-cart-shopping"></i> کسٹمر آرڈر فارم</h3>
        
        <div class="field">
            <label>آپ کا نام اور فون نمبر</label>
            <input type="text" id="c-name" placeholder="نام اور موبائل نمبر...">
        </div>
        <div class="field">
            <label>ڈلیوری کا مکمل پتہ (ملتان)</label>
            <input type="text" id="c-address" placeholder="مثلاً DHA فیز 2 / BZU گیٹ...">
        </div>
        <div class="field">
            <label>منڈی یا فیکٹری سے کیا منگوانا ہے؟</label>
            <textarea id="c-items" placeholder="سامان کی تفصیل..."></textarea>
        </div>
        <button onclick="submitOrder()" class="btn" style="width:100%; margin-top:8px;">آرڈر بک کریں</button>
    </div>

    <div class="rider-dash" id="rider-section">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:12px;">
            <h3 style="color:#F3D88B;"><i class="fa-solid fa-motorcycle"></i> رائیڈر لائیو ڈیش بورڈ</h3>
            <span style="background:var(--gold); color:#000; font-size:12px; font-weight:700; padding:2px 10px; border-radius:99px;">آن لائن</span>
        </div>

        <div id="live-orders-container">
            <div class="order-card">
                <div style="display:flex; justify-content:space-between; font-size:15px;">
                    <span style="background:#1E8A55; padding:2px 8px; border-radius:4px; font-size:12px;">آرڈر #WM-101</span>
                    <b style="color:#F3D88B;">فیس: Rs. 250</b>
                </div>
                <h4 style="margin:6px 0 2px 0; font-size:16px; color:#F3D88B;">پک اپ: سبزی منڈی / خانیوال روڈ</h4>
                <p style="font-size:14px; margin:0; color:#e2e8f0;">پتہ: DHA فیز 2، ملتان</p>
                <button onclick="acceptOrder(this)" class="btn" style="width:100%; background:var(--gold); border-color:var(--gold); color:#000; min-height:42px; font-size:15px; margin-top:10px;">آرڈر قبول کریں (Accept)</button>
            </div>
        </div>
    </div>
</div>

</div></section>

<footer><div class="wrap">
<div class="frow2">
<div class="fname">وزیرِ ملتانی</div>
<a class="tel" href="tel:+923056243881">0305 6243881</a>
</div>
<small>ملتان، پاکستان • آزاد رائیڈر ڈلیوری پلیٹ فارم</small>
</div></footer>

<script>
function submitOrder() {
    var name = document.getElementById('c-name').value;
    var address = document.getElementById('c-address').value;
    var items = document.getElementById('c-items').value;

    if(!name || !address || !items) {
        alert('براہ کرم تمام معلومات درج کریں۔');
        return;
    }

    var container = document.getElementById('live-orders-container');
    var orderId = 'WM-' + Math.floor(100 + Math.random() * 900);
    
    var newCard = document.createElement('div');
    newCard.className = 'order-card';
    newCard.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-size:15px;">
            <span style="background:#1E8A55; padding:2px 8px; border-radius:4px; font-size:12px;">آرڈر #${orderId}</span>
            <b style="color:#F3D88B;">فیس: Rs. 300</b>
        </div>
        <h4 style="margin:6px 0 2px 0; font-size:16px; color:#F3D88B;">پک اپ: غلہ منڈی / خانیوال روڈ</h4>
        <p style="font-size:14px; margin:0; color:#e2e8f0;">گراہک: ${name} | پتہ: ${address}</p>
        <p style="font-size:13px; margin:4px 0 0 0; color:#a7f3d0;">تفصیل: ${items}</p>
        <button onclick="acceptOrder(this)" class="btn" style="width:100%; background:var(--gold); border-color:var(--gold); color:#000; min-height:42px; font-size:15px; margin-top:10px;">آرڈر قبول کریں (Accept)</button>
    `;
    
    container.prepend(newCard);
    alert('آپ کا آرڈر کامیابی سے بک ہو گیا ہے اور اب رائیڈر ڈیش بورڈ پر شو ہو رہا ہے!');
    
    document.getElementById('c-name').value = '';
    document.getElementById('c-address').value = '';
    document.getElementById('c-items').value = '';
}

function acceptOrder(btn) {
    btn.style.background = '#16a34a';
    btn.style.color = '#fff';
    btn.innerHTML = '<i class="fa-solid fa-check"></i> آرڈر قبول کر لیا گیا';
    btn.disabled = true;
    alert('مبارک ہو! آپ نے آرڈر قبول کر لیا ہے۔ اب منڈی سے اصل رسید لے کر روانہ ہوں۔');
}
</script>

</body>
</html>
