<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وزیرِ ملتانی - ان ڈرائیو طرز لائیو ڈیلیوری ایپ</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --g900: #0A3D27; --g800: #0D4A2F; --g700: #0F5C39; --accent: #10B981; --bg: #F4F7F6; --text: #1F2937; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
        .app-container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; padding: 20px; }
        h1 { color: var(--g900); font-size: 24px; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--g800); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { width: 100%; background: var(--g700); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: var(--g800); }
        .order-card { background: #f9f9f9; border-right: 4px solid var(--accent); padding: 12px; margin-top: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>وزیرِ ملتانی</h1>
    <p class="subtitle">ملتان کا اپنا لائیو ڈیلیوری سسٹم</p>

    <div id="booking-section">
        <div class="form-group">
            <label>آپ کا نام:</label>
            <input type="text" id="custName" placeholder="نام درج کریں">
        </div>
        <div class="form-group">
            <label>فون نمبر:</label>
            <input type="tel" id="custPhone" placeholder="03XXXXXXXXX">
        </div>
        <div class="form-group">
            <label>پک اپ کی جگہ (مقام):</label>
            <input type="text" id="pickupLoc" placeholder="مثلاً: گھنٹہ گھر، ملتان">
        </div>
        <div class="form-group">
            <label>ڈراپ آف (منزل):</label>
            <input type="text" id="dropLoc" placeholder="مثلاً: گلشن بازار، ملتان">
        </div>
        <div class="form-group">
            <label>پیشکش کرایہ (روپے):</label>
            <input type="number" id="bidPrice" placeholder="مناسب کرایہ درج کریں">
        </div>
        <button onclick="placeOrder()">آرڈر بک کریں</button>
    </div>

    <div style="margin-top: 25px;">
        <h3>لائیو آرڈرز (رائڈرز کے لیے)</h3>
        <div id="ordersList">آرڈرز لوڈ ہو رہے ہیں...</div>
    </div>
</div>

<script>
    // فائر بیس کنفیگریشن (wazir-multani-66446)
    const firebaseConfig = {
        databaseURL: "https://wazir-multani-66446-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function placeOrder() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const pickup = document.getElementById('pickupLoc').value;
        const drop = document.getElementById('dropLoc').value;
        const price = document.getElementById('bidPrice').value;

        if(!name || !phone || !pickup || !drop || !price) {
            alert("براہ کرم تمام خانے پر کریں۔");
            return;
        }

        const orderData = {
            name: name,
            phone: phone,
            pickup: pickup,
            drop: drop,
            price: price,
            status: "Pending",
            timestamp: Date.now()
        };

        db.ref('orders').push(orderData).then(() => {
            alert("آرڈر کامیابی سے سبمٹ ہو گیا ہے! رائڈر کو الرٹ بھیج دیا گیا ہے۔");
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('pickupLoc').value = '';
            document.getElementById('dropLoc').value = '';
            document.getElementById('bidPrice').value = '';
        }).catch((error) => {
            alert("خرابی: " + error.message);
        });
    }

    // لائیو آرڈرز شو کرنا
    db.ref('orders').on('value', (snapshot) => {
        const listDiv = document.getElementById('ordersList');
        listDiv.innerHTML = '';
        const data = snapshot.val();
        if(!data) {
            listDiv.innerHTML = '<p>اس وقت کوئی نیا آرڈر موجود نہیں۔</p>';
            return;
        }
        Object.keys(data).forEach(key => {
            const order = data[key];
            listDiv.innerHTML += `
                <div class="order-card">
                    <strong>کسٹمر:</strong> ${order.name} (${order.phone})<br>
                    <strong>مقام:</strong> ${order.pickup} ➔ ${order.drop}<br>
                    <strong>کرایہ:</strong> PKR ${order.price}
                </div>
            `;
        });
    });
</script>

</body>
</html>
